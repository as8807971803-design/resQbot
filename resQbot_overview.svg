<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f4fbff"/>
      <stop offset="100%" stop-color="#eaf3ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0%" stop-color="#2d4059"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0b1220" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <text x="700" y="70" text-anchor="middle" font-size="42" font-family="Arial, sans-serif" font-weight="700" fill="#162033">resQbot Concept Diagram</text>
  <text x="700" y="110" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#4b5d7a">Autonomous rescue / hazard-inspection robot</text>

  <!-- Robot body -->
  <g filter="url(#shadow)">
    <rect x="420" y="250" width="560" height="300" rx="32" fill="url(#body)"/>
  </g>

  <!-- Wheels -->
  <g>
    <circle cx="500" cy="610" r="68" fill="#111827"/>
    <circle cx="900" cy="610" r="68" fill="#111827"/>
    <circle cx="500" cy="610" r="30" fill="#374151"/>
    <circle cx="900" cy="610" r="30" fill="#374151"/>

    <circle cx="500" cy="250" r="68" fill="#111827"/>
    <circle cx="900" cy="250" r="68" fill="#111827"/>
    <circle cx="500" cy="250" r="30" fill="#374151"/>
    <circle cx="900" cy="250" r="30" fill="#374151"/>
  </g>

  <!-- Chassis details -->
  <rect x="455" y="340" width="490" height="150" rx="20" fill="#1f2d3d" stroke="#4fd1a5" stroke-width="3"/>
  <rect x="490" y="365" width="200" height="100" rx="12" fill="#0f172a" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="730" y="365" width="180" height="100" rx="12" fill="#0f172a" stroke="#a78bfa" stroke-width="2"/>

  <!-- Arduino Uno -->
  <g>
    <rect x="520" y="385" width="155" height="60" rx="8" fill="#dbeafe" stroke="#374151" stroke-width="2"/>
    <text x="597.5" y="422" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#1f2937">Arduino</text>
  </g>

  <!-- Motor driver -->
  <g>
    <rect x="760" y="385" width="120" height="60" rx="8" fill="#d9f99d" stroke="#374151" stroke-width="2"/>
    <text x="820" y="422" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" font-weight="700" fill="#1f2937">L298N</text>
  </g>

  <!-- Ultrasonic sensor + servo -->
  <g>
    <rect x="1060" y="315" width="130" height="38" rx="10" fill="#94a3b8"/>
    <text x="1125" y="340" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">HC-SR04</text>

    <g transform="translate(1125 255)">
      <circle cx="0" cy="0" r="55" fill="#dbeafe" stroke="#475569" stroke-width="3"/>
      <rect x="-16" y="-90" width="32" height="90" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
      <rect x="-16" y="-80" width="32" height="18" fill="#cbd5e1"/>
      <rect x="-12" y="-95" width="24" height="12" fill="#f59e0b"/>
      <circle cx="0" cy="0" r="8" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#475569" stroke-width="3"/>
    </g>
    <path d="M 1070 250 L 1125 200 L 1180 250" fill="none" stroke="#64748b" stroke-width="4"/>
  </g>

  <!-- PIR sensor -->
  <g>
    <rect x="195" y="390" width="105" height="52" rx="8" fill="#cfe8ff" stroke="#475569" stroke-width="2"/>
    <circle cx="247" cy="416" r="16" fill="#93c5fd" stroke="#1d4ed8" stroke-width="2"/>
    <text x="247" y="470" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" font-weight="700" fill="#1e293b">PIR</text>
  </g>

  <!-- Gas sensor -->
  <g>
    <rect x="190" y="285" width="120" height="60" rx="10" fill="#fee2e2" stroke="#991b1b" stroke-width="2"/>
    <circle cx="225" cy="315" r="16" fill="#fca5a5" stroke="#7f1d1d" stroke-width="2"/>
    <text x="250" y="320" font-size="16" font-family="Arial, sans-serif" font-weight="700" fill="#7f1d1d">MQ-2</text>
  </g>

  <!-- Buzzer -->
  <g>
    <rect x="1180" y="470" width="70" height="60" rx="12" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
    <circle cx="1215" cy="500" r="18" fill="#fbbf24" stroke="#78350f" stroke-width="2"/>
    <text x="1215" y="560" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" font-weight="700" fill="#78350f">Buzzer</text>
  </g>

  <!-- LED array -->
  <g>
    <circle cx="352" cy="330" r="12" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <circle cx="352" cy="370" r="12" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <circle cx="352" cy="410" r="12" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <circle cx="352" cy="450" r="12" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <circle cx="352" cy="490" r="12" fill="#ef4444" stroke="#7f1d1d" stroke-width="2"/>
    <text x="330" y="530" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" font-weight="700" fill="#1f2937">LEDs</text>
  </g>

  <!-- Power / battery -->
  <g>
    <rect x="650" y="175" width="100" height="60" rx="12" fill="#d1fae5" stroke="#065f46" stroke-width="2"/>
    <text x="700" y="211" text-anchor="middle" font-size="15" font-family="Arial, sans-serif" font-weight="700" fill="#065f46">3x 18650</text>
    <rect x="640" y="150" width="120" height="20" fill="#0f172a" rx="6"/>
    <text x="700" y="143" text-anchor="middle" font-size="16" font-family="Arial, sans-serif" font-weight="700" fill="#0f172a">Battery pack</text>
  </g>

  <!-- Wiring lines -->
  <g stroke="#64748b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 500 250 L 420 250 L 420 220 L 350 220"/>
    <path d="M 900 250 L 1040 250"/>
    <path d="M 1125 315 L 1125 255"/>
    <path d="M 195 416 L 120 416 L 120 300 L 190 300"/>
    <path d="M 295 315 L 420 315"/>
    <path d="M 295 416 L 420 416"/>
    <path d="M 352 330 L 420 330"/>
    <path d="M 352 490 L 420 490"/>
    <path d="M 1180 500 L 1040 500"/>
    <path d="M 680 175 L 680 120 L 900 120 L 900 250"/>
  </g>

  <!-- Labels for sensor directions -->
  <g font-family="Arial, sans-serif" font-size="18" fill="#e2e8f0">
    <text x="730" y="740" text-anchor="middle">Front scan / obstacle detection</text>
  </g>

  <!-- Subtle floor line -->
  <rect x="80" y="660" width="1240" height="8" rx="4" fill="#cbd5e1" opacity="0.8"/>
</svg>
